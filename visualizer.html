<title>Clawd tanzt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap">
<style>
/* Layout: a dark dance floor stage, controls in one strip below. Stage stays dark in both themes (it is a club). */
:root {
  --bg: #f3efed; --fg: #2a211d; --muted: #7a6a63; --line: #ddd2cc;
  --clawd: #d97757; --heart: #ff6f91; --floor: #1d1613; --floor-fg: #f1e8e3;
  --display: "Silkscreen", ui-monospace, monospace;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1715; --fg: #f1e8e3; --muted: #a8968e; --line: #3a302b; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #1b1715; --fg: #f1e8e3; --muted: #a8968e; --line: #3a302b; color-scheme: dark }
html, body { height: 100% }
body { background: var(--bg); color: var(--fg); font-family: var(--body); display: flex; flex-direction: column; box-sizing: border-box; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px }
h1 { font-family: var(--display); font-weight: 400; font-size: 1.6rem; margin: 0; color: var(--clawd) }
.hint { color: var(--muted); font-size: .85rem }
#stage { flex: 1; min-height: 320px; border-radius: 6px; background: var(--floor); position: relative; overflow: hidden }
canvas { display: block; width: 100%; height: 100% }
.hud { position: absolute; left: 14px; top: 12px; font-family: var(--mono); font-size: .8rem; color: var(--floor-fg); opacity: .75; font-variant-numeric: tabular-nums; display: flex; gap: 16px }
.hud b { font-weight: 400; color: var(--clawd) }
footer { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
#track { font-family: var(--mono); font-size: .8rem; color: var(--muted); flex: 1 1 200px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
button, .file { font: 600 .85rem var(--body); background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 8px 13px; cursor: pointer;
  transition: transform 160ms var(--spring), border-color 160ms ease }
button:hover, .file:hover { border-color: var(--clawd) }
button:active, .file:active { transform: scale(.92) }
button:focus-visible, .file:focus-within { outline: 2px solid var(--clawd); outline-offset: 2px }
button.primary { background: var(--clawd); border-color: var(--clawd); color: #fff }
.file input { position: absolute; opacity: 0; width: 1px; height: 1px }
@media (prefers-reduced-motion: reduce) { button, .file, button:active, .file:active { transition: none; transform: none } }
</style>

<header>
  <h1>Clawd tanzt</h1>
  <span class="hint">Spiel den Demo-Beat oder wähle eigene Musik. Clawd hört mit und tanzt im Takt.</span>
</header>
<div id="stage"><div class="hud"><span>Tempo <b id="bpm">–</b> BPM</span><span>Beats <b id="beats">0</b></span></div></div>
<footer>
  <button id="demo" class="primary">Demo-Beat abspielen</button>
  <label class="file" for="file">Eigene Musik wählen<input id="file" type="file" accept="audio/*"></label>
  <button id="pause" hidden>Pause</button>
  <span id="track">Noch keine Musik – Clawd wartet auf der Tanzfläche.</span>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const stage = document.getElementById('stage');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 200);
  scene.add(new THREE.HemisphereLight(0xfff1ea, 0x3a2a24, 0.75));
  const sun = new THREE.DirectionalLight(0xffffff, 0.6);
  sun.position.set(5, 16, 12); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14 }); scene.add(sun);
  const spot = new THREE.PointLight(0xff6f91, 0, 30); spot.position.set(-6, 9, 6); scene.add(spot);
  const spot2 = new THREE.PointLight(0x7ec8ff, 0, 30); spot2.position.set(6, 9, 6); scene.add(spot2);

  // dance floor: a voxel grid of tiles that light up on the beat
  const tileGeo = new THREE.BoxGeometry(1.9, 0.3, 1.9), tiles = [];
  for (let i = -5; i <= 5; i++) for (let j = -4; j <= 3; j++) {
    const m = new THREE.Mesh(tileGeo, new THREE.MeshStandardMaterial({ color: 0x2b211d, roughness: 0.5, emissive: 0x000000 }));
    m.position.set(i * 2, -0.15, j * 2); m.receiveShadow = true; scene.add(m); tiles.push(m);
  }

  // Clawd (same voxel layout as clawd.py / viewer.html)
  const orange = new THREE.MeshStandardMaterial({ color: 0xd97757, roughness: 0.7 });
  const cube = new THREE.BoxGeometry(1, 1, 1);
  const clawd = new THREE.Group(), body = new THREE.Group(), armL = new THREE.Group(), armR = new THREE.Group();
  const legs = [2, 4, 7, 9].map(() => new THREE.Group());
  clawd.add(body, armL, armR, ...legs);
  const put = (g, x, y, z) => { const m = new THREE.Mesh(cube, orange); m.position.set(x - 5.5, y + 0.5, -(z - 2.5)); m.castShadow = m.receiveShadow = true; g.add(m); };
  const box = (g, x0, x1, y0, y1, z0, z1) => { for (let x = x0; x < x1; x++) for (let y = y0; y < y1; y++) for (let z = z0; z < z1; z++) put(g, x, y, z); };
  box(body, 1, 11, 2, 7, 0, 6); box(armL, 0, 1, 3, 5, 2, 4); box(armR, 11, 12, 3, 5, 2, 4);
  [2, 4, 7, 9].forEach((lx, i) => box(legs[i], lx, lx + 1, 0, 2, 1, 5));
  const FRONT = 3.0;
  const plate = (w, h, c) => new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.08), new THREE.MeshStandardMaterial({ color: c, roughness: 0.3 }));
  const eyes = [-2.5, 2.5].map(x => {
    const e = new THREE.Group(); e.position.set(x, 5, FRONT + 0.04);
    const s1 = plate(0.38, 0.38, 0xffffff); s1.position.set(0.2, 0.55, 0.05);
    const s2 = plate(0.18, 0.18, 0xffffff); s2.position.set(-0.22, -0.45, 0.05);
    e.add(plate(1, 2, 0x15100d), s1, s2); body.add(e); return e;
  });
  const cheekMat = new THREE.MeshStandardMaterial({ color: 0xff8fa3, roughness: 0.9, transparent: true, opacity: 0.55, emissive: 0xff6f91, emissiveIntensity: 0 });
  [-3.6, 3.6].forEach(x => { const c = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.55, 0.06), cheekMat); c.position.set(x, 3.7, FRONT + 0.03); body.add(c); });
  // shoulders as pivots so both arms can go up
  [[armL, -5.5], [armR, 5.5]].forEach(([a, x]) => { const p = new THREE.Vector3(x, 4, 0); a.children.forEach(m => m.position.sub(p)); a.position.copy(p); });
  clawd.position.z = 0.5; scene.add(clawd);

  // voxel equalizer wall behind Clawd
  const BARS = 16, ROWS = 12, eq = [];
  for (let b = 0; b < BARS; b++) {
    const col = [];
    const hue = 0.02 + b / BARS * 0.9;
    for (let r = 0; r < ROWS; r++) {
      const c = new THREE.Color().setHSL((hue + r * 0.012) % 1, 0.75, 0.6);
      const m = new THREE.Mesh(cube, new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.55, roughness: 0.4 }));
      m.scale.set(1.25, 0.9, 0.9); m.position.set((b - (BARS - 1) / 2) * 1.5, r * 1.05 + 0.5, -9); m.visible = false;
      scene.add(m); col.push(m);
    }
    eq.push(col);
  }

  // ── Audio: one graph for demo beat and user files ──
  let ctx, analyser, master, freq, mediaEl, mediaSrc, demoTimer = null, playing = false, mode = null;
  const trackEl = document.getElementById('track'), pauseBtn = document.getElementById('pause'), demoBtn = document.getElementById('demo');
  function ensureAudio() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.8;
    analyser = ctx.createAnalyser(); analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.3;
    master.connect(analyser); analyser.connect(ctx.destination);
    freq = new Uint8Array(analyser.frequencyBinCount);
  }
  // Demo: 118 BPM, C – Am – F – G, kick, hats, bass, marimba
  const BPM = 118, SPB = 60 / BPM; let nextNote = 0, step = 0;
  const f = m => 440 * Math.pow(2, (m - 69) / 12);
  const CH = [[48, 52, 55], [45, 48, 52], [41, 45, 48], [43, 47, 50]];
  function tone(t, freqHz, dur, type, gain, sweepTo) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freqHz, t);
    if (sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo, t + dur * 0.6);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  let noiseBuf;
  function hat(t, gain) {
    if (!noiseBuf) { noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.1, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = ctx.createBufferSource(), hp = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; hp.type = 'highpass'; hp.frequency.value = 7000;
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    s.connect(hp); hp.connect(g); g.connect(master); s.start(t); s.stop(t + 0.06);
  }
  function scheduleDemo() {
    while (nextNote < ctx.currentTime + 0.12) {
      const t = nextNote, s16 = step % 16, bar = Math.floor(step / 16) % 4, ch = CH[bar];
      if (s16 % 4 === 0) { tone(t, 130, 0.35, 'sine', 0.9, 45); setTimeout(() => { if (playing && mode === 'demo') onBeat(performance.now() / 1000); }, Math.max(0, (t - ctx.currentTime) * 1000)); }
      if (s16 % 4 === 2) hat(t, 0.25);
      if (s16 % 8 === 4) hat(t, 0.4);
      if (s16 % 2 === 0) tone(t, f(ch[0] + (s16 % 8 === 6 ? 12 : 0)), 0.22, 'triangle', 0.35);
      if ([0, 3, 6, 10, 12].includes(s16)) tone(t, f(ch[[0, 1, 2, 1, 2][[0, 3, 6, 10, 12].indexOf(s16)]] + 24), 0.4, 'sine', 0.18);
      nextNote += SPB / 4; step++;
    }
  }
  function stopAll() {
    if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
    if (mediaEl) mediaEl.pause();
    playing = false; pauseBtn.hidden = true;
  }
  demoBtn.onclick = async () => {
    ensureAudio(); await ctx.resume(); stopAll();
    nextNote = ctx.currentTime + 0.05; step = 0;
    demoTimer = setInterval(scheduleDemo, 25); scheduleDemo();
    mode = 'demo'; playing = true; pauseBtn.hidden = false; pauseBtn.textContent = 'Pause'; resetTempo();
    trackEl.textContent = `Demo-Beat · ${BPM} BPM · C – Am – F – G`;
  };
  document.getElementById('file').onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    ensureAudio(); await ctx.resume(); stopAll();
    if (!mediaEl) { mediaEl = new Audio(); mediaEl.loop = true; mediaSrc = ctx.createMediaElementSource(mediaEl); mediaSrc.connect(master); }
    if (mediaEl.src) URL.revokeObjectURL(mediaEl.src);
    mediaEl.src = URL.createObjectURL(file);
    try { await mediaEl.play(); mode = 'file'; playing = true; pauseBtn.hidden = false; pauseBtn.textContent = 'Pause'; resetTempo(); trackEl.textContent = file.name; }
    catch { trackEl.textContent = 'Diese Datei kann der Browser nicht abspielen. Probier MP3, M4A, OGG oder WAV.'; }
  };
  pauseBtn.onclick = async () => {
    if (playing) {
      if (mode === 'demo') { clearInterval(demoTimer); demoTimer = null; await ctx.suspend(); } else mediaEl.pause();
      playing = false; pauseBtn.textContent = 'Weiter';
    } else {
      await ctx.resume();
      if (mode === 'demo') { nextNote = ctx.currentTime + 0.05; demoTimer = setInterval(scheduleDemo, 25); } else await mediaEl.play();
      playing = true; pauseBtn.textContent = 'Pause';
    }
  };

  // ── Beat detection: bass-energy onset vs. a running average ──
  let avg = 0, lastBeat = -1, beatCount = 0, beatT = -1, intervals = [];
  const bpmEl = document.getElementById('bpm'), beatsEl = document.getElementById('beats');
  function resetTempo() { intervals = []; avg = 0; bpmEl.textContent = '–'; }
  function onBeat(t) {
    if (lastBeat > 0) { const d = t - lastBeat; if (d > 0.27 && d < 1.5) { intervals.push(d); if (intervals.length > 24) intervals.shift(); } }
    lastBeat = t; beatT = t; beatCount++; beatsEl.textContent = beatCount;
    if (intervals.length >= 4) {
      const s = [...intervals].sort((a, b) => a - b); let bpm = 60 / s[s.length >> 1];
      while (bpm < 80) bpm *= 2; while (bpm > 170) bpm /= 2;
      bpmEl.textContent = Math.round(bpm);
    }
  }

  const resize = () => { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); };
  new ResizeObserver(resize).observe(stage); resize();

  // Analysis runs on its own 10 ms clock so beat detection does not depend on the frame rate
  const raw = new Float32Array(BARS); let loud = 0;
  setInterval(() => {
    if (!analyser || !playing) return;
    const t = performance.now() / 1000;
    analyser.getByteFrequencyData(freq);
    const hz = ctx.sampleRate / analyser.fftSize, nb = Math.ceil(85 / hz);
    let bass = 0; for (let i = 1; i < nb; i++) bass += freq[i]; bass /= (nb - 1) * 255;
    loud = 0;
    for (let b = 0; b < BARS; b++) { // log-spaced bands 40 Hz – 12 kHz
      const lo = Math.floor(40 * Math.pow(300, b / BARS) / hz), hi = Math.max(lo + 1, Math.floor(40 * Math.pow(300, (b + 1) / BARS) / hz));
      let s = 0; for (let i = lo; i < hi; i++) s += freq[i]; raw[b] = s / ((hi - lo) * 255); loud += raw[b];
    }
    loud /= BARS;
    // demo beats come straight from its sequencer; files use onset detection
    if (mode === 'file' && bass > avg * 1.35 + 0.05 && bass > 0.3 && t - lastBeat > 0.3) onBeat(t);
    avg = avg + (bass - avg) * 0.03;
  }, 10);

  const levels = new Float32Array(BARS);
  let last = performance.now(), level = 0, lean = 0, nextBlink = 2;
  const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
  renderer.setAnimationLoop(now => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = now / 1000;
    for (let b = 0; b < BARS; b++) levels[b] = damp(levels[b], playing ? raw[b] : 0, playing ? 18 : 6, dt);
    level = damp(level, playing ? loud * 2.2 : 0, 6, dt);
    const L = Math.min(1, level);

    // dance: hop on each beat, lean side to side, arms alternate up, happy eyes when it is loud
    const u = beatT > 0 ? (t - beatT) / 0.32 : 2;
    const hop = u < 1 ? 4 * u * (1 - u) : 0;
    const k = reduce ? 0.25 : 1;
    clawd.position.y = hop * 0.9 * k * (0.5 + L);
    const sq = u < 0.12 ? 1 - 0.12 * (1 - u / 0.12) : 1 + 0.05 * hop;
    const sy = reduce ? 1 : sq, sx = 1 / Math.sqrt(sy);
    clawd.scale.set(sx, sy, sx);
    const side = beatCount % 2 ? 1 : -1;
    lean = damp(lean, playing ? side * 0.14 * k * (0.4 + L) : Math.sin(t * 1.5) * 0.02, 10, dt);
    clawd.rotation.z = lean; clawd.rotation.y = damp(clawd.rotation.y, playing ? side * 0.18 * k : 0, 6, dt);
    armL.rotation.z = damp(armL.rotation.z, playing ? -(side > 0 ? 1.4 : 0.3) * k * (0.5 + L) : 0, 12, dt);
    armR.rotation.z = damp(armR.rotation.z, playing ? (side < 0 ? 1.4 : 0.3) * k * (0.5 + L) : 0, 12, dt);
    legs.forEach((l, i) => { l.position.y = playing && !reduce ? Math.max(0, Math.sin((t - beatT) * Math.PI / 0.32 + i * 1.3)) * 0.25 * (u < 1 ? 1 : 0) : 0; });

    let eyeY = 1;
    if (t > nextBlink) { if (t - nextBlink < 0.14) eyeY = Math.max(0.08, Math.abs(1 - (t - nextBlink) / 0.07)); else nextBlink = t + 2.5 + Math.random() * 3; }
    const happy = playing ? Math.min(1, Math.max(0, (L - 0.35) * 3)) : 0;
    eyes.forEach((e, i) => { e.scale.y = Math.min(eyeY, 1 - happy * 0.82); e.position.y = 5 + happy * 0.45; e.children[1].visible = e.children[2].visible = happy < 0.5; });
    cheekMat.opacity = 0.55 + happy * 0.4; cheekMat.emissiveIntensity = 0.4 * Math.max(0, 1 - u);

    // equalizer wall + floor tiles + coloured lights
    eq.forEach((col, b) => { const h = Math.max(1, Math.round(Math.min(1, Math.sqrt(levels[b]) * 1.25) * ROWS)); col.forEach((m, r) => { m.visible = r < h; }); });
    const flash = Math.max(0, 1 - u * 1.6);
    tiles.forEach((m, i) => {
      const on = playing && ((i + beatCount) % 3 === 0);
      m.material.emissive.setHSL(((i * 0.07 + beatCount * 0.11) % 1), 0.8, on ? 0.18 + 0.25 * flash : 0.02);
    });
    spot.intensity = playing ? 0.25 + 0.9 * flash * (side > 0) : 0;
    spot2.intensity = playing ? 0.25 + 0.9 * flash * (side < 0) : 0;

    const yaw = Math.sin(t * 0.25) * 0.25;
    camera.position.set(Math.sin(yaw) * 36, 12, Math.cos(yaw) * 36);
    camera.lookAt(0, 5.2, -2.5);
    renderer.render(scene, camera);
  });
})();
</script>
